<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devmeet 프로토타입</title>
<style>
@import "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap";
@font-face{font-family:"Pretendard";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/Pretendard-Regular.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/Pretendard-Medium.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/Pretendard-SemiBold.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/Pretendard-Bold.woff2") format("woff2")}
@layer components;
@layer properties {
  @supports (((-webkit-hyphens: none)) and (not (margin-trim: inline))) or
    ((-moz-orient: inline) and (not (color: rgb(from red r g b)))) {
    *,
    :before,
    :after,
    ::backdrop {
      --tw-rotate-x: initial;
      --tw-rotate-y: initial;
      --tw-rotate-z: initial;
      --tw-skew-x: initial;
      --tw-skew-y: initial;
      --tw-blur: initial;
      --tw-brightness: initial;
      --tw-contrast: initial;
      --tw-grayscale: initial;
      --tw-hue-rotate: initial;
      --tw-invert: initial;
      --tw-opacity: initial;
      --tw-saturate: initial;
      --tw-sepia: initial;
      --tw-drop-shadow: initial;
      --tw-drop-shadow-color: initial;
      --tw-drop-shadow-alpha: 100%;
      --tw-drop-shadow-size: initial;
    }
  }
}
@layer theme {
  :root,
  :host {
    --font-sans: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji",
      "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
      "Liberation Mono", "Courier New", monospace;
    --spacing: 0.25rem;
    --radius-sm: 0.25rem;
    --radius-md: 0.375rem;
    --radius-lg: 0.5rem;
    --default-font-family: var(--font-sans);
    --default-mono-font-family: var(--font-mono);
  }
}
@layer base {
  *,
  :after,
  :before,
  ::backdrop {
    box-sizing: border-box;
    border: 0 solid;
    margin: 0;
    padding: 0;
  }
  ::file-selector-button {
    box-sizing: border-box;
    border: 0 solid;
    margin: 0;
    padding: 0;
  }
  html,
  :host {
    -webkit-text-size-adjust: 100%;
    tab-size: 4;
    line-height: 1.5;
    font-family: var(
      --default-font-family,
      ui-sans-serif,
      system-ui,
      sans-serif,
      "Apple Color Emoji",
      "Segoe UI Emoji",
      "Segoe UI Symbol",
      "Noto Color Emoji"
    );
    font-feature-settings: var(--default-font-feature-settings, normal);
    font-variation-settings: var(--default-font-variation-settings, normal);
    -webkit-tap-highlight-color: transparent;
  }
  hr {
    height: 0;
    color: inherit;
    border-top-width: 1px;
  }
  abbr:where([title]) {
    -webkit-text-decoration: underline dotted;
    text-decoration: underline dotted;
  }
  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-size: inherit;
    font-weight: inherit;
  }
  a {
    color: inherit;
    -webkit-text-decoration: inherit;
    -webkit-text-decoration: inherit;
    -webkit-text-decoration: inherit;
    -webkit-text-decoration: inherit;
    text-decoration: inherit;
  }
  b,
  strong {
    font-weight: bolder;
  }
  code,
  kbd,
  samp,
  pre {
    font-family: var(
      --default-mono-font-family,
      ui-monospace,
      SFMono-Regular,
      Menlo,
      Monaco,
      Consolas,
      "Liberation Mono",
      "Courier New",
      monospace
    );
    font-feature-settings: var(--default-mono-font-feature-settings, normal);
    font-variation-settings: var(
      --default-mono-font-variation-settings,
      normal
    );
    font-size: 1em;
  }
  small {
    font-size: 80%;
  }
  sub,
  sup {
    vertical-align: baseline;
    font-size: 75%;
    line-height: 0;
    position: relative;
  }
  sub {
    bottom: -0.25em;
  }
  sup {
    top: -0.5em;
  }
  table {
    text-indent: 0;
    border-color: inherit;
    border-collapse: collapse;
  }
  :-moz-focusring {
    outline: auto;
  }
  progress {
    vertical-align: baseline;
  }
  summary {
    display: list-item;
  }
  ol,
  ul,
  menu {
    list-style: none;
  }
  img,
  svg,
  video,
  canvas,
  audio,
  iframe,
  embed,
  object {
    vertical-align: middle;
    display: block;
  }
  img,
  video {
    max-width: 100%;
    height: auto;
  }
  button,
  input,
  select,
  optgroup,
  textarea {
    font: inherit;
    font-feature-settings: inherit;
    font-variation-settings: inherit;
    letter-spacing: inherit;
    color: inherit;
    opacity: 1;
    background-color: #0000;
    border-radius: 0;
  }
  ::file-selector-button {
    font: inherit;
    font-feature-settings: inherit;
    font-variation-settings: inherit;
    letter-spacing: inherit;
    color: inherit;
    opacity: 1;
    background-color: #0000;
    border-radius: 0;
  }
  :where(select:is([multiple], [size])) optgroup {
    font-weight: bolder;
  }
  :where(select:is([multiple], [size])) optgroup option {
    padding-inline-start: 20px;
  }
  ::file-selector-button {
    margin-inline-end: 4px;
  }
  ::placeholder {
    opacity: 1;
  }
  @supports (not ((-webkit-appearance: -apple-pay-button))) or
    (contain-intrinsic-size: 1px) {
    ::placeholder {
      color: currentColor;
    }
    @supports (color: color-mix(in lab, red, red)) {
      ::placeholder {
        color: color-mix(in oklab, currentcolor 50%, transparent);
      }
    }
  }
  textarea {
    resize: vertical;
  }
  ::-webkit-search-decoration {
    -webkit-appearance: none;
  }
  ::-webkit-date-and-time-value {
    min-height: 1lh;
    text-align: inherit;
  }
  ::-webkit-datetime-edit {
    display: inline-flex;
  }
  ::-webkit-datetime-edit-fields-wrapper {
    padding: 0;
  }
  ::-webkit-datetime-edit {
    padding-block: 0;
  }
  ::-webkit-datetime-edit-year-field {
    padding-block: 0;
  }
  ::-webkit-datetime-edit-month-field {
    padding-block: 0;
  }
  ::-webkit-datetime-edit-day-field {
    padding-block: 0;
  }
  ::-webkit-datetime-edit-hour-field {
    padding-block: 0;
  }
  ::-webkit-datetime-edit-minute-field {
    padding-block: 0;
  }
  ::-webkit-datetime-edit-second-field {
    padding-block: 0;
  }
  ::-webkit-datetime-edit-millisecond-field {
    padding-block: 0;
  }
  ::-webkit-datetime-edit-meridiem-field {
    padding-block: 0;
  }
  ::-webkit-calendar-picker-indicator {
    line-height: 1;
  }
  :-moz-ui-invalid {
    box-shadow: none;
  }
  button,
  input:where([type="button"], [type="reset"], [type="submit"]) {
    appearance: button;
  }
  ::file-selector-button {
    appearance: button;
  }
  ::-webkit-inner-spin-button {
    height: auto;
  }
  ::-webkit-outer-spin-button {
    height: auto;
  }
  [hidden]:where(:not([hidden="until-found"])) {
    display: none !important;
  }
}
@layer utilities {
  .fixed {
    position: fixed;
  }
  .start {
    inset-inline-start: var(--spacing);
  }
  .grid {
    display: grid;
  }
  .hidden {
    display: none;
  }
  .inline {
    display: inline;
  }
  .transform {
    transform: var(--tw-rotate-x,) var(--tw-rotate-y,) var(--tw-rotate-z,)
      var(--tw-skew-x,) var(--tw-skew-y,);
  }
  .filter {
    filter: var(--tw-blur,) var(--tw-brightness,) var(--tw-contrast,)
      var(--tw-grayscale,) var(--tw-hue-rotate,) var(--tw-invert,)
      var(--tw-saturate,) var(--tw-sepia,) var(--tw-drop-shadow,);
  }
}
:root {
  color-scheme: dark;
  /* 원본 사이트는 viewport-fit=cover가 없어 safe-area가 0. 아티팩트는 :root가 safe-area만큼 여백을 주므로 높이에서 빼고, 하단 여백은 원본 px값만 쓴다. */
  --app-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  --canvas: #191919;
  --surface: #222;
  --surface-elevated: #303030;
  --surface-hover: #373737;
  --border: #3d3d3d;
  --text-primary: #f3f3ef;
  --text-secondary: #b2b2ad;
  --text-muted: #858580;
  --green: #b4f3a2;
  --green-ink: #172414;
  --lilac: #ddaaf2;
  --lilac-ink: #26192c;
  --danger: #e5aaa6;
  --mono: "JetBrains Mono", monospace;
  --sans: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI",
    sans-serif;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --radius-sm: 9px;
  --radius-md: 14px;
  --radius-lg: 18px;
  color: var(--text-primary);
  font-family: var(--sans);
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
html,
body,
#root {
  min-height: 100%;
  margin: 0;
}
body {
  background: #101010;
  /* 아티팩트 기본 body 글꼴(14px 시스템 글꼴)을 덮어 원본처럼 :root 값을 따르게 한다 */
  color: var(--text-primary);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
}
button,
input {
  color: inherit;
  font: inherit;
}
button {
  cursor: pointer;
  border: 0;
}
button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
}
.app-canvas {
  background: #101010;
  justify-content: center;
  align-items: flex-start;
  min-height: var(--app-height);
  display: flex;
}
.phone-shell {
  background: var(--canvas);
  width: min(100%, 430px);
  min-height: var(--app-height);
  position: relative;
  overflow: hidden;
}
.screen {
  min-height: var(--app-height);
}
.recommendation-screen {
  padding: 0 var(--space-5) 154px;
}
.topbar,
.detail-topbar,
.chat-header {
  justify-content: space-between;
  align-items: center;
  height: 64px;
  display: flex;
}
.brand {
  font-family: var(--mono);
  letter-spacing: -0.03em;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
}
.brand-mark {
  background: var(--text-primary);
  color: var(--canvas);
  letter-spacing: -0.12em;
  border-radius: 6px;
  justify-content: center;
  align-items: center;
  width: 24px;
  height: 24px;
  display: inline-flex;
}
.icon {
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.7px;
  flex: none;
}
.icon-button {
  color: var(--text-secondary);
  background: 0 0;
  border-radius: 50%;
  justify-content: center;
  align-items: center;
  width: 44px;
  height: 44px;
  display: flex;
}
.icon-button:active {
  background: var(--surface);
}
.recommend-heading {
  justify-content: space-between;
  align-items: flex-end;
  padding: 8px 2px 18px;
  display: flex;
}
.eyebrow,
.mono-label,
.counter,
.like-balance,
.merged-label {
  font-family: var(--mono);
}
.eyebrow,
.mono-label {
  color: var(--text-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin: 0;
  font-size: 10px;
  font-weight: 600;
}
.typing-line {
  height: 16px;
}
.recommend-heading h1,
.detail-identity h1,
.empty-conversation h1,
.simple-empty h1 {
  letter-spacing: -0.045em;
  margin: 4px 0 0;
  font-size: 28px;
  line-height: 1.22;
}
.subtitle {
  color: var(--text-secondary);
  margin: 5px 0 0;
  font-size: 14px;
}
.counter {
  color: var(--text-muted);
  align-items: center;
  gap: 7px;
  padding-bottom: 5px;
  font-size: 11px;
  display: flex;
}
.counter i {
  background: var(--border);
  width: 14px;
  height: 1px;
}
.profile-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  cursor: pointer;
  overflow: hidden;
}
.reveal {
  animation: 0.2s ease-out both reveal;
}
.photo-wrap {
  height: clamp(270px, 39dvh, 328px);
  position: relative;
  overflow: hidden;
}
.photo-wrap img,
.detail-photo {
  object-fit: cover;
  width: 100%;
  height: 100%;
  display: block;
}
.detail-link {
  z-index: 1;
  background: #191919c7;
  border: 1px solid #ffffff24;
  border-radius: 999px;
  align-items: center;
  gap: 3px;
  padding: 8px 11px;
  font-size: 12px;
  display: flex;
  position: absolute;
  bottom: 14px;
  right: 14px;
}
.card-content {
  padding: 17px 18px 18px;
}
.identity-row {
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  display: flex;
}
.identity-row h2 {
  letter-spacing: -0.035em;
  margin: 0;
  font-size: 22px;
  line-height: 1.2;
}
.identity-row p {
  color: var(--text-secondary);
  margin: 5px 0 0;
  font-size: 13px;
}
.verified-badge {
  color: var(--text-secondary);
  white-space: nowrap;
  flex: none;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  display: inline-flex;
}
.verified-dot {
  background: var(--green);
  color: var(--green-ink);
  border-radius: 50%;
  justify-content: center;
  align-items: center;
  width: 16px;
  height: 16px;
  display: inline-flex;
}
.match-reason {
  border-left: 2px solid var(--green);
  margin-top: 18px;
  padding-left: 12px;
}
.match-reason .mono-label {
  color: var(--green);
}
.match-reason p {
  margin: 4px 0 0;
  font-size: 14px;
  line-height: 1.5;
}
.intro-clamp {
  color: var(--text-secondary);
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  margin: 15px 0 0;
  font-size: 13px;
  line-height: 1.6;
  display: -webkit-box;
  overflow: hidden;
}
.recommend-actions {
  grid-template-columns: 0.8fr 1.35fr;
  gap: 10px;
  margin-top: 14px;
  display: grid;
}
.primary-button,
.secondary-button,
.match-cta,
.apply-button {
  border-radius: var(--radius-sm);
  justify-content: center;
  align-items: center;
  gap: 7px;
  height: 50px;
  font-size: 14px;
  font-weight: 700;
  display: flex;
}
.primary-button {
  background: var(--text-primary);
  color: var(--canvas);
  width: 100%;
  transition:
    background 0.16s,
    transform 0.16s;
}
.primary-button:active {
  transform: scale(0.98);
}
.primary-button.is-sent {
  background: var(--green);
  color: var(--green-ink);
}
.secondary-button {
  background: var(--surface);
  color: var(--text-secondary);
}
.like-balance {
  color: var(--text-muted);
  text-align: right;
  margin: 9px 2px 0;
  font-size: 10px;
}
.like-balance.guide {
  color: var(--text-secondary);
}
.bottom-nav {
  height: 82px;
  padding: 8px 12px 11px;
  z-index: 5;
  background: #191919f7;
  border-top: 1px solid #303030;
  grid-template-columns: repeat(4, 1fr);
  align-items: flex-start;
  display: grid;
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
}
.nav-item {
  color: var(--text-muted);
  background: 0 0;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  height: 52px;
  font-size: 10px;
  display: flex;
}
.nav-item.active {
  color: var(--text-primary);
}
.nav-item.active .icon {
  color: var(--green);
}
.detail-screen {
  padding-bottom: 86px;
}
.detail-topbar {
  z-index: 3;
  background: #191919f0;
  padding: 0 14px;
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
}
.header-spacer {
  width: 44px;
}
.detail-scroll {
  overscroll-behavior: contain;
  height: calc(var(--app-height) - 86px);
  overflow-y: auto;
}
.detail-photo {
  height: min(55dvh, 460px);
}
.detail-identity,
.detail-section {
  padding: 24px 22px;
}
.detail-identity {
  border-bottom: 1px solid var(--border);
}
.detail-identity > p:not(.eyebrow) {
  color: var(--text-secondary);
  margin: 7px 0 0;
  font-size: 15px;
}
.badge-row {
  flex-wrap: wrap;
  gap: 12px 16px;
  margin-top: 18px;
  display: flex;
}
.reason-panel {
  background: var(--surface);
  border-radius: var(--radius-md);
  margin: 22px;
  padding: 18px;
}
.reason-panel .mono-label {
  color: var(--green);
}
.reason-panel p {
  margin: 8px 0 0;
  font-size: 16px;
  line-height: 1.55;
}
.detail-section {
  border-top: 1px solid var(--border);
}
.detail-section h2 {
  letter-spacing: -0.025em;
  margin: 0 0 18px;
  font-size: 18px;
}
.value-list > div {
  justify-content: space-between;
  align-items: center;
  min-height: 43px;
  display: flex;
}
.value-list span,
.info-grid span {
  color: var(--text-muted);
  font-size: 13px;
}
.value-list strong,
.info-grid strong {
  font-size: 14px;
  font-weight: 500;
}
.body-copy {
  color: var(--text-secondary);
  margin: 0;
  font-size: 16px;
  line-height: 1.75;
}
.info-grid {
  grid-template-columns: 1fr 1fr;
  gap: 18px 24px;
  display: grid;
}
.info-grid div {
  flex-direction: column;
  gap: 5px;
  display: flex;
}
.quiet-tags {
  gap: 8px;
  margin-top: 24px;
  display: flex;
}
.quiet-tags span {
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-family: var(--mono);
  border-radius: 999px;
  padding: 7px 9px;
  font-size: 10px;
}
.sticky-action {
  padding: 12px 20px 18px;
  background: #191919f5;
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
}
.modal-layer,
.sheet-layer {
  z-index: 20;
  background: #000000b3;
  justify-content: center;
  align-items: flex-end;
  display: flex;
  position: absolute;
  inset: 0;
}
.modal-layer {
  align-items: center;
  padding: 20px;
}
.match-dialog {
  background: var(--surface);
  text-align: center;
  border: 1px solid #424242;
  border-radius: 20px;
  width: 100%;
  padding: 28px 22px 20px;
  animation: 0.36s cubic-bezier(0.22, 0.8, 0.25, 1) both match-in;
}
.merged-label {
  color: var(--lilac);
  letter-spacing: 0.12em;
  margin-bottom: 23px;
  font-size: 10px;
  display: block;
}
.match-portraits {
  justify-content: center;
  align-items: center;
  display: flex;
}
.match-portraits img {
  border: 3px solid var(--surface);
  object-fit: cover;
  border-radius: 50%;
  width: 78px;
  height: 78px;
}
.connection-line {
  align-items: center;
  width: 44px;
  margin: 0 -3px;
  display: flex;
}
.connection-line:before,
.connection-line:after {
  background: var(--lilac);
  content: "";
  border-radius: 50%;
  width: 5px;
  height: 5px;
}
.connection-line i {
  background: var(--lilac);
  transform-origin: 50%;
  width: 34px;
  height: 1px;
  animation: 0.42s ease-out 0.12s both line-grow;
}
.match-dialog h2 {
  letter-spacing: -0.04em;
  margin: 24px 0 0;
  font-size: 25px;
}
.match-copy {
  color: var(--text-secondary);
  margin: 9px 0 20px;
  font-size: 14px;
  line-height: 1.6;
}
.shared-value {
  background: var(--surface-elevated);
  border-radius: 10px;
  padding: 14px;
}
.shared-value span {
  color: var(--text-muted);
  font-size: 11px;
}
.shared-value p {
  margin: 5px 0 0;
  font-size: 14px;
}
.match-cta {
  background: var(--lilac);
  color: var(--lilac-ink);
  width: 100%;
  margin-top: 18px;
}
.text-button {
  color: var(--text-secondary);
  background: 0 0;
  margin-top: 17px;
  padding: 6px 10px;
  font-size: 13px;
}
.chat-screen {
  flex-direction: column;
  display: flex;
}
.chat-header {
  border-bottom: 1px solid var(--border);
  flex: none;
  padding: 0 10px;
}
.chat-person {
  align-items: center;
  gap: 10px;
  display: flex;
}
.chat-person img {
  object-fit: cover;
  border-radius: 50%;
  width: 36px;
  height: 36px;
}
.chat-person div {
  flex-direction: column;
  gap: 3px;
  display: flex;
}
.chat-person strong {
  font-size: 14px;
}
.chat-person span {
  color: var(--text-muted);
  align-items: center;
  gap: 4px;
  font-size: 10px;
  display: flex;
}
.chat-person span i {
  background: var(--green);
  border-radius: 50%;
  width: 5px;
  height: 5px;
}
.conversation {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}
.empty-conversation {
  text-align: center;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 64dvh;
  display: flex;
}
.chat-open-mark {
  color: var(--green);
  font-family: var(--mono);
  margin-bottom: 14px;
  font-size: 12px;
}
.empty-conversation p {
  color: var(--text-muted);
  margin: 10px 0 25px;
  font-size: 14px;
  line-height: 1.65;
}
.suggestions {
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  display: flex;
}
.suggestions button {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  border-radius: 999px;
  min-height: 40px;
  padding: 9px 13px;
  font-size: 13px;
}
.message-list {
  flex-direction: column;
  display: flex;
}
.date-divider {
  color: var(--text-muted);
  margin: 4px auto 30px;
  font-size: 11px;
}
.message-row {
  align-self: flex-end;
  align-items: flex-end;
  gap: 7px;
  margin-bottom: 10px;
  display: flex;
}
.message-row span {
  background: var(--text-primary);
  color: var(--canvas);
  border-radius: 15px 15px 3px;
  max-width: 270px;
  padding: 11px 14px;
  font-size: 15px;
  line-height: 1.45;
}
.message-row time {
  color: var(--text-muted);
  font-size: 9px;
}
.composer {
  border-top: 1px solid var(--border);
  padding: 10px 14px 14px;
  flex: none;
  align-items: center;
  gap: 8px;
  display: flex;
}
.composer input {
  background: var(--surface-elevated);
  border: 1px solid #0000;
  border-radius: 12px;
  outline: none;
  width: 100%;
  min-width: 0;
  height: 48px;
  padding: 0 15px;
}
.composer input::placeholder {
  color: var(--text-muted);
}
.composer input:focus {
  border-color: var(--border);
}
.send-button {
  background: var(--surface-elevated);
  color: var(--text-muted);
  border-radius: 10px;
  flex: 0 0 48px;
  justify-content: center;
  align-items: center;
  height: 48px;
  display: flex;
}
.send-button.active {
  background: var(--green);
  color: var(--green-ink);
}
.sending-dot {
  background: currentColor;
  border-radius: 50%;
  width: 6px;
  height: 6px;
  animation: 0.7s ease-in-out infinite pulse;
}
.bottom-sheet {
  background: var(--surface);
  padding: 8px 20px 24px;
  border-radius: 20px 20px 0 0;
  width: 100%;
  animation: 0.25s ease-out both sheet-up;
}
.sheet-handle {
  background: #555;
  border-radius: 999px;
  width: 38px;
  height: 4px;
  margin: 0 auto 13px;
}
.bottom-sheet header {
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  display: flex;
}
.bottom-sheet h2 {
  margin: 4px 0 0;
  font-size: 22px;
}
.filter-group {
  padding: 14px 0 18px;
}
.filter-group label,
.filter-line span {
  color: var(--text-muted);
  font-size: 13px;
}
.choice-row {
  gap: 8px;
  margin-top: 10px;
  display: flex;
}
.choice-row button {
  background: var(--surface-elevated);
  border: 1px solid #0000;
  border-radius: 9px;
  align-items: center;
  gap: 6px;
  min-height: 42px;
  padding: 0 15px;
  font-size: 13px;
  display: flex;
}
.choice-row button.selected {
  border-color: var(--green);
  color: var(--green);
}
.filter-line {
  border-top: 1px solid var(--border);
  justify-content: space-between;
  align-items: center;
  min-height: 54px;
  display: flex;
}
.filter-line strong {
  font-size: 14px;
  font-weight: 500;
}
.sheet-actions {
  grid-template-columns: 0.7fr 1.3fr;
  gap: 10px;
  margin-top: 14px;
  display: grid;
}
.reset-button,
.apply-button {
  height: 50px;
}
.reset-button {
  background: var(--surface-elevated);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
}
.apply-button {
  background: var(--text-primary);
  color: var(--canvas);
}
.menu-list button {
  border-top: 1px solid var(--border);
  text-align: left;
  background: 0 0;
  width: 100%;
  min-height: 54px;
}
.menu-list .danger {
  color: var(--danger);
}
.simple-screen {
  padding: 0 20px 100px;
}
.simple-empty {
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 65dvh;
  display: flex;
}
.simple-empty p {
  color: var(--text-muted);
  font-size: 14px;
}
@keyframes reveal {
  0% {
    opacity: 0;
    transform: translateY(7px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes match-in {
  0% {
    opacity: 0;
    transform: translateY(8px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
@keyframes line-grow {
  0% {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}
@keyframes sheet-up {
  0% {
    transform: translateY(100%);
  }
  to {
    transform: translateY(0);
  }
}
@keyframes pulse {
  50% {
    opacity: 0.5;
  }
}
@media (width>=431px) {
  .phone-shell {
    border-left: 1px solid #2b2b2b;
    border-right: 1px solid #2b2b2b;
  }
}
@media (height<=760px) {
  .photo-wrap {
    height: 255px;
  }
  .recommend-heading {
    padding-bottom: 12px;
  }
  .card-content {
    padding-top: 14px;
    padding-bottom: 15px;
  }
  .intro-clamp {
    display: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  :before,
  :after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}
